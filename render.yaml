# Render Blueprint: one API service + one static site (+ managed PostgreSQL).
# Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: helpdesk-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci && npx nest build
    startCommand: node dist/main.js
    healthCheckPath: /docs
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DB_SSL
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: SEED_DEMO
        value: "true"
      # Set after the first deploy to the static site's URL, e.g. https://helpdesk-web.onrender.com
      - key: CORS_ORIGIN
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/uploads

  - type: web
    name: helpdesk-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      # Browser calls /api/* on the same origin; Render forwards it to the API service.
      - type: rewrite
        source: /api/*
        destination: https://helpdesk-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: helpdesk-db
    plan: free
    databaseName: helpdesk
    user: helpdesk
