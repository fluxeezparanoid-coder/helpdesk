# One command: docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: helpdesk
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://helpdesk:${POSTGRES_PASSWORD}@db:5432/helpdesk
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ random chars) in .env}
      CORS_ORIGIN: http://localhost:8080
      TRUST_PROXY: "true"
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes: [uploads:/data/uploads]

  web:
    build: ./web
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  dbdata:
  uploads:
